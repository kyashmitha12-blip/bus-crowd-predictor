<!-- index.html -->
<!-- Login page: student/teacher/transport enter a username and pick their role -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bus Crowd Predictor - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="app-card">
        <h2>Bus Crowd Predictor</h2>
        <p>Enter your username and select your role to continue</p>

        <!-- Simple login: no password, just username + role -->
        <form action="/" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>

            <div class="mb-3">
                <label for="role" class="form-label">I am a</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="transport">Transport Department</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <hr>
        <p>
            <a href="/driver">Driver view (no login needed)</a>
        </p>
    </div>

</body>
</html>
