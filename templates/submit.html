<!-- submit.html -->
<!-- Student/Teacher page: select a bus + boarding point and confirm boarding for today -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bus Crowd Predictor - Confirm Boarding</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="app-card">
        <div class="top-nav">
            <a href="/submit">Confirm Boarding</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
        </div>

        <h2>Confirm Your Boarding</h2>
        <p>Logged in as <strong>{{ username }}</strong></p>

        <!-- This form saves a boarding record for today -->
        <form action="/submit" method="POST">

            <div class="mb-3">
                <label for="bus_number" class="form-label">Bus Route</label>
                <select class="form-select" id="bus_number" name="bus_number" required>
                    <option value="">-- Select Bus --</option>
                    {% for bus in buses %}
                        <option value="{{ bus[0] }}">{{ bus[0] }} - {{ bus[1] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="boarding_point" class="form-label">Boarding Point</label>
                <select class="form-select" id="boarding_point" name="boarding_point" required>
                    <option value="">-- Select Stop --</option>
                    {% for point in boarding_points %}
                        <option value="{{ point }}">{{ point }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-success">I'm Boarding Today</button>
        </form>
    </div>

</body>
</html>
